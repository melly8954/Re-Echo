spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope: openid, email, profile
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile_nickname, profile_image, account_email
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
            scope: read:user, user:email
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  output:
    ansi:
      enabled: always

logging:
  level:
    com.reecho: info
    org.springframework.security: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: info

  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n"

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

reecho:
  auth:
    jwt:
      issuer: re-echo
      secret: ${REECHO_JWT_SECRET}
      access-token-ttl: 1h
      refresh-token-ttl: 14d
    oauth2-login:
      refresh-token-cookie-name: refreshToken
      refresh-token-secure: false
      success-redirect-uri: http://localhost:5173/oauth/callback
      failure-redirect-uri: http://localhost:5173/login
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      presign-ttl: 10m
