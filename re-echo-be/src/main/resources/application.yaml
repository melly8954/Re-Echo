spring:
  application:
    name: re-echo-be

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
    clean-disabled: true

  session:
    store-type: redis
    timeout: 10m
    redis:
      namespace: reecho:oauth-session

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
